<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mooncci · 个人技术手记</title>
    <meta name="description" content="mooncci 的个人技术手记，记录文章、日常近况与作品进展。" />
    <meta property="og:site_name" content="mooncci" />
    <script>
      try {
        var savedTheme = localStorage.getItem('mooncci-theme');
        var initialTheme = savedTheme === 'dark' || savedTheme === 'plasma' ? 'dark' : 'light';
        document.documentElement.dataset.moonTheme = initialTheme;
        document.documentElement.classList.toggle('dark', initialTheme === 'dark');
        document.documentElement.style.colorScheme = initialTheme;
      } catch (_) {}
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root { height: 100%; }
      .startup-shell { box-sizing:border-box;min-height:100vh;padding:28px max(24px,calc((100vw - 1200px)/2));font-family:system-ui,sans-serif;color:#202020;background:#fafafa; }
      .startup-brand { color:inherit;text-decoration:none;font-size:19px;font-weight:550;letter-spacing:-.04em; }
      .startup-body { margin:72px auto;max-width:560px;line-height:1.7; }
      .startup-body h1 { font-size:24px;letter-spacing:-.02em; }
      .startup-body p { color:#666; }
      .startup-body button { font:inherit;padding:10px 18px;border:1px solid #ccc;border-radius:8px;background:transparent;color:inherit;cursor:pointer; }
      html[data-moon-theme="dark"] .startup-shell { color:#eee;background:#151515; }
      html[data-moon-theme="dark"] .startup-body p { color:#aaa; }
    </style>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="mooncci · 最近更新"
      href="/api/feed.xml"
    />
  </head>
  <body>
    <div id="root"><div id="startup-shell" class="startup-shell"><a class="startup-brand" href="/">mooncci</a><main class="startup-body"><h1>正在打开页面</h1><p id="startup-message" role="status">正在加载，请稍候。</p><button id="startup-retry" hidden type="button">重新加载</button><noscript><p lang="zh-CN">请在浏览器中启用 JavaScript 后重新打开。</p><p lang="en">Enable JavaScript in your browser and reopen this page.</p></noscript></main></div></div>
    <script>
      (function () {
        var retry = document.getElementById('startup-retry');
        if (!retry) return;
        var locale = /^\/en(?:\/|$)/.test(location.pathname) ? 'en' : '';
        if (!locale) {
          try { var saved = JSON.parse(localStorage.getItem('mooncci:language') || 'null'); if (saved && (saved.preference === 'en' || saved.preference === 'zh-CN')) locale = saved.preference; } catch (_) {}
          if (!locale) { var languages = navigator.languages || [navigator.language]; for (var i=0;i<languages.length;i++) { if (/^en(?:-|$)/i.test(languages[i])) {locale='en';break;} if (/^zh(?:-|$)/i.test(languages[i])) {locale='zh-CN';break;} } }
        }
        var english = locale === 'en';
        document.documentElement.lang = english ? 'en' : 'zh-CN';
        document.querySelector('#startup-shell h1').textContent = english ? 'Opening page' : '正在打开页面';
        document.getElementById('startup-message').textContent = english ? 'Loading, please wait.' : '正在加载，请稍候。';
        retry.textContent = english ? 'Reload' : '重新加载';
        document.title = english ? 'mooncci · Notes on technology' : 'mooncci · 个人技术手记';
        retry.addEventListener('click', function () { location.reload(); });
        var timer = setTimeout(function () {
          var message = document.getElementById('startup-message');
          if (message) { message.textContent = english ? 'This page is taking longer to load. Check your connection and try again.' : '页面加载时间较长，请检查网络后重试。'; retry.hidden = false; }
        }, 12000);
        window.addEventListener('mooncci:mounted', function () { clearTimeout(timer); }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
