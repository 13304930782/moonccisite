name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/full-site-bilingual]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: python3 scripts/prepare-ip-database.py
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npm test --prefix server
      - run: npm run build
      - run: node scripts/test-document.mjs
      - run: npm run test:bilingual:ssr
      - run: npm run check:bundle
      - run: python3 scripts/test_indexnow.py
      - run: python3 scripts/test_refresh_sitemap.py
      - run: python3 scripts/test-offline-release.py
      - run: python3 scripts/test-security-alerts-release.py
      - run: python3 -m py_compile scripts/build-cover-framing-release.py
      - run: python3 scripts/test-cover-focus-release.py
      - run: python3 scripts/test-works-release.py
      - run: python3 -m py_compile scripts/build-works-release.py
      - run: bash -n scripts/deploy-works.sh scripts/rollback-works.sh scripts/stage-works-reader-assets.sh
      - run: python3 -m py_compile scripts/build-cover-focus-release.py
      - run: bash -n scripts/deploy-cover-focus.sh scripts/rollback-cover-focus.sh
      - run: bash -n scripts/deploy-cover-framing.sh scripts/rollback-cover-framing.sh
      - run: python3 scripts/test-us-http2.py
      - run: python3 ops/geo-gateway-preview/test_install_image_cache.py
      - run: bash -n scripts/deploy-social-login.sh
      - run: bash -n scripts/deploy-google-login.sh
      - run: bash -n scripts/deploy-oauth-diagnostics.sh
      - run: bash -n scripts/deploy-analytics.sh
      - run: bash -n scripts/deploy-admin-lists.sh
      - run: bash -n scripts/deploy-offline-frontend.sh
      - run: bash -n scripts/deploy-audit.sh
      - run: bash -n scripts/deploy-media-capacity.sh
      - name: Install browser dependencies
        timeout-minutes: 8
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          # Hosted runners also select mirrors through this indirection.
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80-mooncci-ci-timeouts >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Verify bilingual history and editing in isolated browsers
        run: npm run test:bilingual:browser
      - name: Preserve bilingual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-browser-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .cache/locale-history-results.json
            .cache/public-history-results.json
            .cache/bilingual-hydration-results.json
            .cache/public-history-*-375.png
      - run: node test/mobile-inputs.browser.cjs
      - run: node scripts/test-daily-question-history-browser.cjs
      - run: node scripts/test-browser.cjs
      - run: node scripts/test-experience-fixes-browser.cjs
      - run: node scripts/test-ai-summary-browser.cjs
      - run: node scripts/test-updates-browser.cjs
      - run: node scripts/test-google-button-browser.cjs
      - run: node scripts/test-admin-capacity-browser.cjs
      - run: node scripts/test-account-browser.cjs
      - run: node scripts/test-site-design-account-browser.cjs
      - run: node scripts/test-about-browser.cjs
      - run: node scripts/test-festivals-browser.cjs
      - run: node scripts/test-admin-workspace-browser.cjs
      - run: node scripts/test-admin-settings-browser.cjs
      - run: node scripts/test-content-admin-browser.cjs
      - run: node scripts/test-content-discovery-browser.cjs
      - run: node scripts/test-publication-health-browser.cjs
      - run: node scripts/test-article-drafts-browser.cjs
      - run: node scripts/test-article-slug-browser.cjs
      - run: node scripts/test-article-revisions-browser.cjs
      - run: node scripts/test-bookmarks-browser.cjs
      - run: node scripts/test-reading-browser.cjs
      - run: node scripts/test-detail-browser.cjs
      - run: node scripts/test-works-browser.cjs
      - run: node scripts/test-update-journal-browser.cjs
      - run: node scripts/test-analytics-browser.cjs
      - run: node scripts/test-ux-unification.cjs
      - run: node scripts/test-image-retry-browser.cjs
      - run: node scripts/test-article-preview-cards-browser.cjs
      - run: node scripts/test-mail-setup-browser.cjs
      - run: node scripts/test-mailbox-send-feedback.cjs
      - run: node scripts/test-mailbox-navigation.cjs
      - run: node scripts/test-browser-diagnostics.cjs
      - run: bash -n scripts/deploy-site-diagnostics.sh scripts/rollback-site-diagnostics.sh
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python3 ops/mail-setup/test_nginx.py
      - run: node scripts/test-media-dialog-browser.cjs
      - run: node scripts/test-article-images-browser.cjs
      - run: bash -n scripts/deploy-article-images.sh scripts/rollback-article-images.sh
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: node server/scripts/test-integration.js
        env:
          TEST_DB_PORT: '3306'

      - run: node --test server/test/socialLogin.integration.test.js
        env:
          SOCIAL_INTEGRATION: 'true'
          TEST_DB_PORT: '3306'

      - run: node --test server/test/accountSettings.integration.test.js
        env:
          ACCOUNT_INTEGRATION: 'true'
          TEST_DB_PORT: '3306'

      - run: node --test server/test/articleDrafts.integration.test.js
        env:
          DRAFT_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/dailyQuestion.integration.test.js
        env:
          DAILY_QUESTION_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleLikesMigration.integration.test.js
        env:
          ARTICLE_LIKES_MIGRATION_TEST: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/analytics.integration.test.js
        env:
          ANALYTICS_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - name: Verify synchronized business workflows
        run: node --test server/test/publishing.integration.test.js server/test/engagement.integration.test.js server/test/operations.integration.test.js server/test/guidance.integration.test.js server/test/articleConflict.integration.test.js server/test/subscriptionFeedback.test.js
        env:
          TEST_DB_PORT: '3306'
          PUBLISHING_INTEGRATION: 'true'
          ENGAGEMENT_INTEGRATION: 'true'
          OPERATIONS_INTEGRATION: 'true'
          GUIDANCE_INTEGRATION: 'true'
          CONFLICT_INTEGRATION: 'true'
          SUBSCRIPTION_INTEGRATION: 'true'

      - run: node --test server/test/articleImages.integration.test.js
        env:
          IMAGE_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/mediaWorkflow.integration.test.js
        env:
          MEDIA_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleRevisions.integration.test.js
        env:
          REVISION_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleCoverCrop.integration.test.js server/test/articleCoverCropInit.integration.test.js
        env:
          COVER_CROP_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/projectIcon.integration.test.js
        env:
          PROJECT_ICON_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleBookmarks.integration.test.js
        env:
          BOOKMARK_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/readerMigrations.integration.test.js
        env:
          READER_MIGRATION_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleSlug.integration.test.js
        env:
          SLUG_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - name: Verify bilingual publication and idempotent migration
        run: node --test server/test/articleTranslations.integration.test.js
        env:
          BILINGUAL_INTEGRATION: 'true'
          TEST_DB_PORT: '3306'
