name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 nginx rsync
          command -v python3 nginx rsync openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: python3 scripts/prepare-ip-database.py
      - run: npm run typecheck
      - run: npm test
      - run: npm test --prefix server
      - run: npm run build
      - run: node scripts/test-document.mjs
      - run: npm run check:bundle
      - run: python3 scripts/test-offline-release.py
      - run: python3 -m py_compile scripts/build-cover-framing-release.py
      - run: python3 scripts/test-cover-focus-release.py
      - run: python3 scripts/test-works-release.py
      - run: python3 -m py_compile scripts/build-works-release.py
      - run: bash -n scripts/deploy-works.sh scripts/rollback-works.sh scripts/stage-works-reader-assets.sh
      - run: python3 -m py_compile scripts/build-cover-focus-release.py
      - run: bash -n scripts/deploy-cover-focus.sh scripts/rollback-cover-focus.sh
      - run: bash -n scripts/deploy-cover-framing.sh scripts/rollback-cover-framing.sh
      - run: python3 scripts/test-us-http2.py
      - run: python3 ops/geo-gateway-preview/test_install_image_cache.py
      - run: bash -n scripts/deploy-social-login.sh
      - run: bash -n scripts/deploy-google-login.sh
      - run: bash -n scripts/deploy-oauth-diagnostics.sh
      - run: bash -n scripts/deploy-analytics.sh
      - run: bash -n scripts/deploy-admin-lists.sh
      - run: bash -n scripts/deploy-offline-frontend.sh
      - run: bash -n scripts/deploy-audit.sh
      - run: bash -n scripts/deploy-media-capacity.sh
      - run: bash -n scripts/deploy-site-diagnostics.sh scripts/rollback-site-diagnostics.sh
      - run: python3 ops/mail-setup/test_nginx.py
      - run: bash -n scripts/deploy-article-images.sh scripts/rollback-article-images.sh
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
      - name: Seal build artifacts
        run: find dist server/runtime -type f -print0 | sort -z | xargs -0 sha256sum > ci-build.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: |
            dist/
            server/runtime/
            ci-build.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  browser-checks:
    needs: core-checks
    runs-on: ubuntu-24.04
    container:
      # Match package-lock.json; browsers and OS dependencies are already installed.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: account
            commands: |
              node test/mobile-inputs.browser.cjs
              node scripts/test-browser.cjs
              node scripts/test-google-button-browser.cjs
              node scripts/test-admin-capacity-browser.cjs
              node scripts/test-account-browser.cjs
              node scripts/test-site-design-account-browser.cjs
              node scripts/test-article-preview-cards-browser.cjs
              node scripts/test-mailbox-send-feedback.cjs
          - group: publishing
            commands: |
              node scripts/test-article-drafts-browser.cjs
              node scripts/test-article-revisions-browser.cjs
              node scripts/test-bookmarks-browser.cjs
              node scripts/test-reading-browser.cjs
              node scripts/test-works-browser.cjs
              node scripts/test-update-journal-browser.cjs
              node scripts/test-analytics-browser.cjs
              node scripts/test-mail-setup-browser.cjs
          - group: visual
            commands: |
              node scripts/test-updates-browser.cjs
              node scripts/test-detail-browser.cjs
              node scripts/test-ux-unification.cjs
              node scripts/test-image-retry-browser.cjs
              node scripts/test-mailbox-navigation.cjs
              node scripts/test-browser-diagnostics.cjs
              node scripts/test-media-dialog-browser.cjs
              node scripts/test-article-images-browser.cjs
    name: browser-checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
      - name: Verify exact build artifacts
        run: sha256sum --strict -c ci-build.sha256
      - name: Verify bundled browser version
        run: |
          node -e "const assert = require('node:assert/strict'); assert.equal(require('playwright/package.json').version, '1.58.2'); for (const name of ['chromium', 'webkit']) assert.ok(require('node:fs').existsSync(require('playwright')[name].executablePath()), name)"
      - run: mkdir -p .cache/diagnostic-qa
      - name: Run browser regressions
        run: ${{ matrix.commands }}
  # Keep the existing required check; every shard and integration job must succeed.
  build-and-unit:
    if: ${{ always() }}
    needs: [core-checks, browser-checks, mysql-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e "const assert = require('node:assert/strict'); for (const job of Object.values(JSON.parse(process.env.RESULTS))) assert.equal(job.result, 'success')"
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: node server/scripts/test-integration.js
        env:
          TEST_DB_PORT: '3306'

      - run: node --test server/test/socialLogin.integration.test.js
        env:
          SOCIAL_INTEGRATION: 'true'
          TEST_DB_PORT: '3306'

      - run: node --test server/test/accountSettings.integration.test.js
        env:
          ACCOUNT_INTEGRATION: 'true'
          TEST_DB_PORT: '3306'

      - run: node --test server/test/articleDrafts.integration.test.js
        env:
          DRAFT_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/analytics.integration.test.js
        env:
          ANALYTICS_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - name: Verify synchronized business workflows
        run: node --test server/test/publishing.integration.test.js server/test/engagement.integration.test.js server/test/operations.integration.test.js server/test/guidance.integration.test.js server/test/articleConflict.integration.test.js server/test/subscriptionFeedback.test.js
        env:
          TEST_DB_PORT: '3306'
          PUBLISHING_INTEGRATION: 'true'
          ENGAGEMENT_INTEGRATION: 'true'
          OPERATIONS_INTEGRATION: 'true'
          GUIDANCE_INTEGRATION: 'true'
          CONFLICT_INTEGRATION: 'true'
          SUBSCRIPTION_INTEGRATION: 'true'

      - run: node --test server/test/articleImages.integration.test.js
        env:
          IMAGE_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/mediaWorkflow.integration.test.js
        env:
          MEDIA_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleRevisions.integration.test.js
        env:
          REVISION_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleCoverCrop.integration.test.js server/test/articleCoverCropInit.integration.test.js
        env:
          COVER_CROP_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/projectIcon.integration.test.js
        env:
          PROJECT_ICON_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/articleBookmarks.integration.test.js
        env:
          BOOKMARK_INTEGRATION: "true"
          TEST_DB_PORT: "3306"

      - run: node --test server/test/readerMigrations.integration.test.js
        env:
          READER_MIGRATION_INTEGRATION: "true"
          TEST_DB_PORT: "3306"
