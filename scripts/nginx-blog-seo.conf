# Include INSIDE the existing mooncci.site server block, before its location / fallback.
# Preserve the existing /api proxy and immutable /assets configuration.
location = /sitemap.xml { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location = /robots.txt { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
location ~ ^/(?:|articles|archives|about|links|projects|updates|tags|categories|rss|updates/[1-9][0-9]*|projects/[A-Za-z0-9_-]+|category/[^/]+)/?$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ~ ^/article/[^/]+/?$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ~ ^/(admin(?:/.*)?|account(?:/.*)?|login|admin-login|register|reset-password|forgot-password|complete-registration|subscription/.*)/?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =503;
}
