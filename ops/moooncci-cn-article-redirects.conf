# Move the bare homepage, four articles, two listings and three equivalent categories.
# Keep query-driven WordPress routes (such as /?p=171 and /?s=term) intact.
# Included inside the existing moooncci.cn server block; no catch-all redirect.
location = / {
    if ($args != "") {
        rewrite ^ /index.php last;
    }
    return 301 https://mooncci.site/;
}
location = /文章.html/ {
    return 301 https://mooncci.site/articles$is_args$args;
}
location = /时光圈.html/ {
    return 301 https://mooncci.site/updates$is_args$args;
}
location = /category/develop/ {
    return 301 https://mooncci.site/category/develop$is_args$args;
}
location = /category/cities-skylines-ii/ {
    return 301 https://mooncci.site/category/%E9%83%BD%E5%B8%82%E5%A4%A9%E9%99%85%E7%BA%BF2$is_args$args;
}
location = /category/develop/网安/ {
    return 301 https://mooncci.site/category/%E7%BD%91%E7%BB%9C%E5%AE%89%E5%85%A8$is_args$args;
}
location = /develop/fakecloudflare/ {
    return 301 https://mooncci.site/article/15$is_args$args;
}
location = /cities-skylines-ii/cities-skylines-ii-都市天际线2-进阶mod推荐/ {
    return 301 https://mooncci.site/article/18$is_args$args;
